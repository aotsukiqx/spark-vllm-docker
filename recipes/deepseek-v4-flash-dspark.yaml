# Recipe: DeepSeek V4 Flash with DSpark speculative decoding
# Standard FlashInfer sparse-MLA stack (non-B12X) with the topk=256 draft
# decode kernels from FlashInfer PR #3817 applied at build time.

recipe_version: "1"
name: DeepSeek-V4-Flash-DSpark
description: vLLM serving deepseek-ai/DeepSeek-V4-Flash on a dual DGX Spark cluster with DSpark speculative decoding (topk=256 draft decode via FlashInfer PR #3817)

model: deepseek-ai/DeepSeek-V4-Flash
container: vllm-node

build_args:
  - --apply-flashinfer-pr 3817

cluster_only: true

# fix-dspark-dsv4-d2t: draft_id_to_target_id for DSparkSpeculator (vLLM PR #47429)
# add-dsv4-topk256: Python-side dispatch for (H, 256) decode entries (PR #3817)
mods:
  - mods/fix-dspark-dsv4-d2t
  - mods/add-dsv4-topk256

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.8
  max_model_len: auto
  block_size: 256
  max_num_seqs: 8
  max_num_batched_tokens: 8192
  num_speculative_tokens: 5

env:
  CUTE_DSL_ARCH: "sm_121a"
  VLLM_USE_BREAKABLE_CUDAGRAPH: "1"

command: |
  vllm serve deepseek-ai/DeepSeek-V4-Flash \
      --host {host} \
      --port {port} \
      --trust-remote-code \
      --tensor-parallel-size {tensor_parallel} \
      --kv-cache-dtype fp8 \
      --block-size {block_size} \
      --max-model-len {max_model_len} \
      --max-num-seqs {max_num_seqs} \
      --max-num-batched-tokens {max_num_batched_tokens} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      --enable-prefix-caching \
      --speculative-config '{{"method":"dspark","num_speculative_tokens":{num_speculative_tokens},"draft_sample_method":"probabilistic"}}' \
      --tokenizer-mode deepseek_v4 \
      --tool-call-parser deepseek_v4 \
      --enable-auto-tool-choice \
      --reasoning-parser deepseek_v4 \
      --reasoning-config '{{"reasoning_parser":"deepseek_v4","reasoning_start_str":"","reasoning_end_str":""}}' \
      --default-chat-template-kwargs.thinking=true \
      --default-chat-template-kwargs.reasoning_effort=high \
      --load-format instanttensor
